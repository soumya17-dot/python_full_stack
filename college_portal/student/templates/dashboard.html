<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8edf3, #cbd5e1);
        }

        .container {
            width: 420px;
            padding: 50px 35px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.12);
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            color: #0f172a;
            margin-bottom: 15px;
        }

        .username {
            color: #2563eb;
            font-weight: 700;
        }

        p {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 30px;
        }

        form {
            width: 100%;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2563eb;
            box-shadow: 0 5px 15px rgba(30, 58, 138, 0.2);
            transform: translateY(-2px);
        }

        @media (max-width: 450px) {
            .container {
                width: 90%;
                padding: 35px 25px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            Welcome, <span class="username">{{ request.user.username }}</span>!
        </h1>

        <p>You have successfully logged into your account.</p>

        <form action="{% url 'logout' %}" method="POST">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>

    </div>

</body>
</html>
