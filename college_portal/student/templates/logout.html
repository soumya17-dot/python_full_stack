<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout Successful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8edf3, #cbd5e1);
        }

        .container {
            width: 400px;
            padding: 45px 35px;
            background: #ffffff;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.12);
            border: 1px solid #e2e8f0;
        }

        .icon {
            width: 70px;
            height: 70px;
            line-height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            font-size: 35px;
        }

        h1 {
            color: #0f172a;
            font-size: 25px;
            margin-bottom: 15px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        a {
            display: block;
            padding: 13px;
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        a:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 58, 138, 0.2);
        }

        @media (max-width: 450px) {
            .container {
                width: 90%;
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">&#10004;</div>

        <h1>Logged Out Successfully!</h1>

        <p>
            You have successfully logged out of your account.
            Thank you for visiting!
        </p>

        <a href="{% url 'login' %}">Login Again</a>

    </div>

</body>
</html>
