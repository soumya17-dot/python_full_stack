<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8edf3, #cbd5e1);
        }

        form {
            width: 380px;
            padding: 40px 35px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.12);
            border: 1px solid #e2e8f0;
        }

        h1 {
            font-size: 16px;
            color: #334155;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #0f172a;
            font-size: 27px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 28px;
            border: none;
            border-radius: 7px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2563eb;
            box-shadow: 0 5px 15px rgba(30, 58, 138, 0.2);
        }

        @media (max-width: 450px) {
            form {
                width: 90%;
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <form method="POST">
        {% csrf_token %}

        <h2>Welcome Back!</h2>

        <h1>UserName:</h1>
        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
        >

        <h1>Password:</h1>
        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">Login</button>

    </form>

</body>
</html>
